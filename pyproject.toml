[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "arc-payables"
version = "0.1.0"
description = "Arc Payables — Arc Canteen Hackathon workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arc-canteen",
    "eth-abi>=5",
    "eth-account>=0.13",
    "eth-utils>=5",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pycryptodome>=3.22",
    "pydantic-settings>=2.7",
    "uvicorn>=0.34",
]

[project.scripts]
arc-payables-seed = "arc_payables.seed:main"
arc-payables-migrate = "arc_payables.migrate:main"
arc-payables-verify-arc = "arc_payables.verify_arc:main"
arc-payables-fake-circle = "arc_payables.fake_circle:main"
arc-payables-erpnext-bootstrap = "arc_payables.erpnext_bootstrap:main"
arc-payables-live-run = "arc_payables.live_run:main"
arc-payables-rescreen = "arc_payables.monitoring_cli:main"
arc-payables-worker = "arc_payables.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arc_payables"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "arc_payables/migrations"
"src/arc_payables/web" = "arc_payables/web"

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.3",
]
