[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tameion"
version = "0.1.0"
description = "Tameion — Arc Canteen Hackathon workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arc-canteen",
    "eth-abi>=5",
    "eth-account>=0.13",
    "eth-utils>=5",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pycryptodome>=3.22",
    "pydantic-settings>=2.7",
    "uvicorn>=0.34",
]

[project.scripts]
tameion-seed = "tameion.seed:main"
tameion-migrate = "tameion.migrate:main"
tameion-verify-arc = "tameion.verify_arc:main"
tameion-fake-circle = "tameion.fake_circle:main"
tameion-erpnext-bootstrap = "tameion.erpnext_bootstrap:main"
tameion-live-run = "tameion.live_run:main"
tameion-rescreen = "tameion.monitoring_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tameion"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "tameion/migrations"

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.3",
]
