<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
  <title id="t">Hidden instructions in bills: test result</title>
  <desc id="d">Three small AI models, five runs each. With the safety rules on, no hostile case ended in a pay decision. With the rules off, four hostile cases did in every run. Payments were simulated.</desc>
  <defs>
    <style>
      text { font-family: 'Public Sans', 'Segoe UI', system-ui, sans-serif; fill: #1f2a33; }
      .title { font-family: 'Source Serif 4', Georgia, serif; font-size: 38px; font-weight: 650; }
      .lead { font-size: 25px; }
      .th { font-size: 21px; font-weight: 600; fill: #55626b; }
      .cell { font-size: 26px; }
      .fig { font-family: 'Source Serif 4', Georgia, serif; font-size: 30px; font-weight: 650; font-variant-numeric: lining-nums tabular-nums; }
      .note { font-size: 19px; fill: #55626b; }
      .rule { stroke: #1f2a33; stroke-width: 2; }
      .hair { stroke: #d3d7cd; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1200" height="600" fill="#f4f5f0"/>
  <text x="60" y="78" class="title">Hidden instructions in bills: test result</text>
  <text x="60" y="124" class="lead">With the safety rules on, no hostile case ended in a pay decision.</text>
  <text x="60" y="158" class="lead">With the rules switched off, four did, in every run.</text>

  <text x="60" y="226" class="th">Model</text>
  <text x="640" y="226" class="th" text-anchor="end">Runs</text>
  <text x="870" y="226" class="th" text-anchor="end">Rules on</text>
  <text x="1140" y="226" class="th" text-anchor="end">Rules off</text>
  <line x1="60" y1="242" x2="1140" y2="242" class="rule"/>

  <text x="60" y="290" class="cell">DeepSeek V4.1 Flash</text>
  <text x="640" y="290" class="fig" text-anchor="end">5</text>
  <text x="870" y="290" class="fig" text-anchor="end">0</text>
  <text x="1140" y="290" class="fig" text-anchor="end">4</text>
  <line x1="60" y1="314" x2="1140" y2="314" class="hair"/>

  <text x="60" y="362" class="cell">DeepSeek V4 Flash</text>
  <text x="640" y="362" class="fig" text-anchor="end">5</text>
  <text x="870" y="362" class="fig" text-anchor="end">0</text>
  <text x="1140" y="362" class="fig" text-anchor="end">4</text>
  <line x1="60" y1="386" x2="1140" y2="386" class="hair"/>

  <text x="60" y="434" class="cell">Muse Spark 1.3</text>
  <text x="640" y="434" class="fig" text-anchor="end">5</text>
  <text x="870" y="434" class="fig" text-anchor="end">0</text>
  <text x="1140" y="434" class="fig" text-anchor="end">4</text>
  <line x1="60" y1="458" x2="1140" y2="458" class="rule"/>

  <text x="60" y="492" class="note">Columns show hostile cases, out of four per run, that ended in a pay decision.</text>
  <text x="60" y="518" class="note">A separate set of 250 hidden-instruction variants went to each model: none answered pay.</text>
  <text x="60" y="544" class="note">One DeepSeek V4.1 Flash run lost a reply to a malformed answer and is counted apart.</text>
  <text x="60" y="570" class="note">Payments were simulated. The test checks the rules, not the model's accuracy.</text>
</svg>
