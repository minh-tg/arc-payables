<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
  <title id="t">Where Arc Payables sits between ERPNext and the chain</title>
  <desc id="d">ERPNext holds bills, orders, receipts and verified supplier wallets. Arc Payables reads a bill, checks it, asks the Circle wallet to pay through the PaymentGuard contract on Arc, and writes the result back to ERPNext.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f2a33"/>
    </marker>
    <style>
      text { font-family: 'Public Sans', 'Segoe UI', system-ui, sans-serif; fill: #1f2a33; }
      .title { font-family: 'Source Serif 4', Georgia, serif; font-size: 26px; font-weight: 650; }
      .sub { font-size: 15px; fill: #55626b; }
      .item { font-size: 15px; }
      .step { font-size: 14px; font-weight: 600; }
      .note { font-size: 14px; fill: #55626b; }
      .box { fill: #fcfcfa; stroke: #1f2a33; stroke-width: 1.5; }
      .bar { fill: #1f2a33; }
      .flow { stroke: #1f2a33; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #55626b; stroke-width: 1.5; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .num { fill: #1f2a33; }
      .numtext { fill: #fcfcfa; font-size: 14px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1200" height="600" fill="#f4f5f0"/>

  <!-- person -->
  <rect class="box" x="450" y="24" width="320" height="52" rx="3"/>
  <text x="610" y="48" text-anchor="middle" class="step">A person in the console</text>
  <text x="610" y="67" text-anchor="middle" class="note">reviews held bills, approves exceptions</text>
  <line x1="610" y1="76" x2="610" y2="118" class="dash"/>

  <!-- ERPNext -->
  <rect class="box" x="30" y="120" width="300" height="360" rx="3"/>
  <rect class="bar" x="30" y="120" width="300" height="5"/>
  <text x="54" y="166" class="title">ERPNext</text>
  <text x="54" y="192" class="sub">The accounting system</text>
  <text x="54" y="238" class="item">Purchase orders and receipts</text>
  <text x="54" y="268" class="item">Supplier bills</text>
  <text x="54" y="298" class="item">Verified supplier payout wallets</text>
  <text x="54" y="328" class="item">Payment and fee records</text>
  <text x="54" y="436" class="note">In the demo: a real ERPNext sandbox</text>
  <text x="54" y="456" class="note">running on this machine.</text>

  <!-- Arc Payables -->
  <rect class="box" x="420" y="120" width="380" height="360" rx="3"/>
  <rect class="bar" x="420" y="120" width="380" height="5"/>
  <text x="444" y="166" class="title">Arc Payables</text>
  <text x="444" y="192" class="sub">Runs beside ERPNext</text>
  <text x="444" y="238" class="item">Checks each bill against the records</text>
  <text x="444" y="268" class="item">Pays only to the verified wallet</text>
  <text x="444" y="298" class="item">Limits, reserve and duplicate checks</text>
  <text x="444" y="328" class="item">AI gives advice, rules decide</text>
  <text x="444" y="358" class="item">Signs one permit for one payment</text>
  <text x="444" y="388" class="item">Keeps a tamper-evident history</text>
  <text x="444" y="456" class="note">In the demo: payments are simulated.</text>

  <!-- chain -->
  <rect class="box" x="900" y="120" width="270" height="90" rx="3"/>
  <rect class="bar" x="900" y="120" width="270" height="5"/>
  <text x="920" y="156" class="title" style="font-size:20px">Circle wallet</text>
  <text x="920" y="182" class="sub">Holds the USDC, on Arc Testnet</text>

  <rect class="box" x="900" y="250" width="270" height="110" rx="3"/>
  <rect class="bar" x="900" y="250" width="270" height="5"/>
  <text x="920" y="286" class="title" style="font-size:20px">PaymentGuard contract</text>
  <text x="920" y="312" class="sub">Spending limits fixed when it is</text>
  <text x="920" y="332" class="sub">deployed. Nobody can raise them.</text>

  <rect class="box" x="900" y="400" width="270" height="80" rx="3"/>
  <rect class="bar" x="900" y="400" width="270" height="5"/>
  <text x="920" y="436" class="title" style="font-size:20px">Supplier wallet</text>
  <text x="920" y="460" class="sub">The address ERPNext verified</text>

  <line x1="1035" y1="210" x2="1035" y2="246" class="flow"/>
  <line x1="1035" y1="360" x2="1035" y2="396" class="flow"/>

  <!-- flows -->
  <line x1="330" y1="210" x2="416" y2="210" class="flow"/>
  <circle cx="373" cy="190" r="12" class="num"/><text x="373" y="195" text-anchor="middle" class="numtext">1</text>
  <text x="373" y="236" text-anchor="middle" class="note">read bill</text>

  <line x1="800" y1="160" x2="896" y2="160" class="flow"/>
  <circle cx="848" cy="138" r="12" class="num"/><text x="848" y="143" text-anchor="middle" class="numtext">2</text>
  <text x="848" y="186" text-anchor="middle" class="note">pay</text>

  <line x1="416" y1="400" x2="330" y2="400" class="flow"/>
  <circle cx="373" cy="378" r="12" class="num"/><text x="373" y="383" text-anchor="middle" class="numtext">3</text>
  <text x="373" y="426" text-anchor="middle" class="note">write back</text>

  <!-- legend -->
  <text x="30" y="528" class="step">1  Arc Payables reads a bill and what ERPNext holds about it.   2  If every check passes, it asks the wallet to pay once.</text>
  <text x="30" y="552" class="step">3  It writes the payment and the fee back to ERPNext, so the books match the chain.</text>
  <text x="30" y="580" class="note">Run once for real on Arc Testnet with test money (12 Oct). In the console demo, ERPNext is a real sandbox and the payment is simulated.</text>
</svg>
