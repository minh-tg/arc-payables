[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
arc_testnet = "${RPC_URL:-https://testnet-rpc.arc.network}"

[etherscan]
arc_testnet = { key = "${ETHERSCAN_API_KEY:-arc}", url = "https://testnet.arcscan.app/api" }
